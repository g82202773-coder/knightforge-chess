name: KnightForge Engine Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package
        run: python -m pip install -e ".[dev,server]"
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: pytest --cov=knightforge_engine --cov-report=term-missing

  browser-e2e:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install app and browser test dependencies
        run: |
          python -m pip install -e ".[dev,server]" playwright
          python -m playwright install --with-deps chromium
      - name: Run browser end-to-end tests
        run: pytest tests/e2e/test_browser_app.py -v
