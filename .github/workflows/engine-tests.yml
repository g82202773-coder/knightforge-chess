name: KnightForge Engine Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Lint import-order diagnostic
        run: |
          ruff check --fix src tests || true
          git diff -- src/knightforge_engine/opening_tree.py
          ruff check src tests
      - name: Test
        run: pytest --cov=knightforge_engine --cov-report=term-missing
