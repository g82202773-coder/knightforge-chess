name: Build KnightForge Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android-app/**"
      - "web/**"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - name: Setup Capacitor Android Project
        working-directory: android-app
        run: |
          npm install
          npx cap add android
          npx cap sync android
      - name: Build Debug APK
        working-directory: android-app/android
        run: ./gradlew assembleDebug
      - name: Upload KnightForge APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KnightForge-Android-APK
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk
